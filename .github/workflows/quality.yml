name: Content Quality

on:
  pull_request:
    paths:
      - "content/**"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "content/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci

      - name: Markdown lint
        id: lint_md
        run: npm run lint:md
        continue-on-error: true

      - name: Prose lint (Vale)
        id: lint_vale
        uses: errata-ai/vale-action@v2
        with:
          files: content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Front matter check
        id: check_frontmatter
        run: npm run check:frontmatter
        continue-on-error: true

      - name: Image size/alt check
        id: check_images
        run: npm run check:images
        continue-on-error: true

      - name: Quality gate summary
        if: always() && (steps.lint_md.outcome == 'failure' || steps.lint_vale.outcome == 'failure' || steps.check_frontmatter.outcome == 'failure' || steps.check_images.outcome == 'failure')
        run: exit 1
