name: Content Quality

on:
  pull_request:
    paths:
      - "content/**"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "content/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci

      - name: Markdown lint
        run: npm run lint:md

      - name: Prose lint (Vale)
        uses: errata-ai/vale-action@v2
        with:
          files: content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Front matter check
        run: npm run check:frontmatter

      - name: Image size/alt check
        run: npm run check:images
