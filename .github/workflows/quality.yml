name: Content Quality

on:
  pull_request:
    paths:
      - "content/**"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "content/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Detect changed files
        id: changed_files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare against the base branch
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" 2>/dev/null || BASE_REF="main"
            git diff --name-only "origin/$BASE_REF...HEAD" -- 'content/' 2>/dev/null | grep -E '\.(md|png|jpg|jpeg|webp)$' > /tmp/changed_files.txt
          else
            # For push events, compare against the previous commit
            git diff --name-only HEAD~1..HEAD -- 'content/' 2>/dev/null | grep -E '\.(md|png|jpg|jpeg|webp)$' > /tmp/changed_files.txt
          fi
          CHANGED_FILES=$(cat /tmp/changed_files.txt | tr '\n' ' ')
          echo "changed_files_list<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changed_files.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed content files: ${CHANGED_FILES}"

      - name: Markdown lint
        id: lint_md
        shell: bash
        run: |
          if [ ! -s /tmp/changed_files.txt ]; then
            echo "✅ No markdown files changed" | tee lint_md.txt
          else
            set -o pipefail
            # Read files into array
            mapfile -t files < /tmp/changed_files.txt
            if [ ${#files[@]} -gt 0 ]; then
              markdownlint --config=.markdownlint.json "${files[@]}" 2>&1 | tee lint_md.txt
            else
              echo "✅ No markdown files changed" | tee lint_md.txt
            fi
          fi
        continue-on-error: true

      - name: Prose lint (Vale)
        id: lint_vale
        uses: errata-ai/vale-action@v2
        with:
          files: content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Install Vale CLI
        if: always()
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v3.7.1/vale_3.7.1_Linux_64-bit.tar.gz
          sudo tar -xvzf vale_3.7.1_Linux_64-bit.tar.gz -C /usr/local/bin
          vale --version

      - name: Capture Vale output for PR comment
        id: lint_vale_cli
        if: always()
        shell: bash
        run: |
          if [ ! -s /tmp/changed_files.txt ]; then
            echo "✅ No content files changed" > lint_vale.txt
            exit 0
          fi
          echo "Syncing Vale packages..."
          vale sync --config=.vale.ini
          # Capture CLI output and preserve exit code
          set +e
          mapfile -t files < /tmp/changed_files.txt
          if [ ${#files[@]} -gt 0 ]; then
            vale --config=.vale.ini --output=CLI "${files[@]}" 2>&1 | tee lint_vale.txt
            EXIT_CODE=${PIPESTATUS[0]}
          else
            echo "✅ No content files changed" > lint_vale.txt
            EXIT_CODE=0
          fi
          if [ ! -s lint_vale.txt ]; then
            echo "✅ Vale check passed - no issues found" > lint_vale.txt
          fi
          echo "Vale CLI exit code: ${EXIT_CODE}"
          exit ${EXIT_CODE}
        continue-on-error: true

      - name: Front matter check
        id: check_frontmatter
        shell: bash
        run: |
          if [ ! -s /tmp/changed_files.txt ]; then
            echo "✅ No markdown files changed" | tee check_frontmatter.txt
          else
            set -o pipefail
            # Filter for .md files only
            grep '\.md$' /tmp/changed_files.txt > /tmp/md_files.txt || true
            mapfile -t files < /tmp/md_files.txt
            if [ ${#files[@]} -gt 0 ]; then
              node scripts/check-frontmatter.mjs "${files[@]}" 2>&1 | tee check_frontmatter.txt
            else
              echo "✅ No markdown files changed" | tee check_frontmatter.txt
            fi
          fi
        continue-on-error: true

      - name: Image size/alt check
        id: check_images
        shell: bash
        run: |
          if [ ! -s /tmp/changed_files.txt ]; then
            echo "✅ No files changed" | tee check_images.txt
          else
            set -o pipefail
            # Filter for image files only
            grep -E '\.(png|jpg|jpeg|webp)$' /tmp/changed_files.txt > /tmp/img_files.txt || true
            mapfile -t files < /tmp/img_files.txt
            if [ ${#files[@]} -gt 0 ]; then
              node scripts/check-images.mjs "${files[@]}" 2>&1 | tee check_images.txt
            else
              echo "✅ No image files changed" | tee check_images.txt
            fi
          fi
        continue-on-error: true

      - name: Build quality summary
        if: always()
        shell: bash
        env:
          MD_STATUS: ${{ steps.lint_md.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
          VALE_STATUS: ${{ steps.lint_vale_cli.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
          FM_STATUS: ${{ steps.check_frontmatter.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
          IMG_STATUS: ${{ steps.check_images.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
        run: |
          SUMMARY_FILE=quality_summary.md
          echo "## 🔍 Content Quality Check Results" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "| Check | Status |" >> "$SUMMARY_FILE"
          echo "|-------|--------|" >> "$SUMMARY_FILE"
          echo "| Markdown Lint | $MD_STATUS |" >> "$SUMMARY_FILE"
          echo "| Prose Lint (Vale) | $VALE_STATUS |" >> "$SUMMARY_FILE"
          echo "| Front Matter | $FM_STATUS |" >> "$SUMMARY_FILE"
          echo "| Image Validation | $IMG_STATUS |" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "<details>" >> "$SUMMARY_FILE"
          echo "<summary><b>Prose Lint (Vale) Details</b></summary>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "\`\`\`" >> "$SUMMARY_FILE"
          if [ -f lint_vale.txt ]; then tail -n 50 lint_vale.txt >> "$SUMMARY_FILE"; else echo "No output" >> "$SUMMARY_FILE"; fi
          echo "\`\`\`" >> "$SUMMARY_FILE"
          echo "</details>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "<details>" >> "$SUMMARY_FILE"
          echo "<summary><b>Markdown Lint Details</b></summary>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "\`\`\`" >> "$SUMMARY_FILE"
          if [ -f lint_md.txt ]; then tail -n 50 lint_md.txt >> "$SUMMARY_FILE"; else echo "No output" >> "$SUMMARY_FILE"; fi
          echo "\`\`\`" >> "$SUMMARY_FILE"
          echo "</details>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "<details>" >> "$SUMMARY_FILE"
          echo "<summary><b>Front Matter Check Details</b></summary>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "\`\`\`" >> "$SUMMARY_FILE"
          if [ -f check_frontmatter.txt ]; then tail -n 50 check_frontmatter.txt >> "$SUMMARY_FILE"; else echo "No output" >> "$SUMMARY_FILE"; fi
          echo "\`\`\`" >> "$SUMMARY_FILE"
          echo "</details>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "<details>" >> "$SUMMARY_FILE"
          echo "<summary><b>Image Validation Details</b></summary>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "\`\`\`" >> "$SUMMARY_FILE"
          if [ -f check_images.txt ]; then tail -n 50 check_images.txt >> "$SUMMARY_FILE"; else echo "No output" >> "$SUMMARY_FILE"; fi
          echo "\`\`\`" >> "$SUMMARY_FILE"
          echo "</details>" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "---" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "**Run these checks locally to see details:**" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "\`\`\`bash" >> "$SUMMARY_FILE"
          echo "npm run lint:md" >> "$SUMMARY_FILE"
          echo "npm run check:frontmatter" >> "$SUMMARY_FILE"
          echo "npm run check:images" >> "$SUMMARY_FILE"
          echo "\`\`\`" >> "$SUMMARY_FILE"

      - name: Post PR comment with quality results
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-file: quality_summary.md

      - name: Quality gate summary
        if: always() && (steps.lint_md.outcome == 'failure' || steps.lint_vale_cli.outcome == 'failure' || steps.check_frontmatter.outcome == 'failure' || steps.check_images.outcome == 'failure')
        run: exit 1
