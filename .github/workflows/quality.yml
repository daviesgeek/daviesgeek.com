name: Content Quality

on:
  pull_request:
    paths:
      - "content/**"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "content/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci

      - name: Markdown lint
        id: lint_md
        run: npm run lint:md 2>&1 | tee lint_md.txt || true
        continue-on-error: true

      - name: Prose lint (Vale)
        id: lint_vale
        run: npm run lint:vale 2>&1 | tee lint_vale.txt || true
        continue-on-error: true

      - name: Front matter check
        id: check_frontmatter
        run: npm run check:frontmatter 2>&1 | tee check_frontmatter.txt || true
        continue-on-error: true

      - name: Image size/alt check
        id: check_images
        run: npm run check:images 2>&1 | tee check_images.txt || true
        continue-on-error: true

      - name: Quality gate summary
        if: always() && (steps.lint_md.outcome == 'failure' || steps.lint_vale.outcome == 'failure' || steps.check_frontmatter.outcome == 'failure' || steps.check_images.outcome == 'failure')
        run: exit 1

      - name: Post PR comment with quality results
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🔍 Content Quality Check Results

            | Check | Status |
            |-------|--------|
            | Markdown Lint | ${{ steps.lint_md.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Prose Lint (Vale) | ${{ steps.lint_vale.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Front Matter | ${{ steps.check_frontmatter.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Image Validation | ${{ steps.check_images.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |

            <details>
            <summary><b>Markdown Lint Details</b></summary>

            ```
            ${{ steps.lint_md.outcome == 'success' && '✅ All checks passed' || hashFiles('lint_md.txt') != '' && format('{0}', readFile('lint_md.txt')) || 'No output' }}
            ```
            </details>

            <details>
            <summary><b>Prose Lint Details</b></summary>

            ```
            ${{ steps.lint_vale.outcome == 'success' && '✅ All checks passed' || hashFiles('lint_vale.txt') != '' && format('{0}', readFile('lint_vale.txt')) || 'No output' }}
            ```
            </details>

            <details>
            <summary><b>Front Matter Check Details</b></summary>

            ```
            ${{ steps.check_frontmatter.outcome == 'success' && '✅ All checks passed' || hashFiles('check_frontmatter.txt') != '' && format('{0}', readFile('check_frontmatter.txt')) || 'No output' }}
            ```
            </details>

            <details>
            <summary><b>Image Validation Details</b></summary>

            ```
            ${{ steps.check_images.outcome == 'success' && '✅ All checks passed' || hashFiles('check_images.txt') != '' && format('{0}', readFile('check_images.txt')) || 'No output' }}
            ```
            </details>

            ---

            Run these checks locally to preview issues:
            ```bash
            npm run lint:md
            npm run check:frontmatter
            npm run check:images
            ```
